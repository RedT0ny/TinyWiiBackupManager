name: Build Windows x64

on:
  push:
    branches:
      - wiiload-rewind-test
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION_NAME: ${{ github.sha }}

jobs:
  build-windows-x64:
    name: Build for Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-win64.msi" -OutFile llvm.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i llvm.msi /qn /norestart'
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Download and extract VC-LTL5
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/VC-LTL5/releases/download/v5.3.1/VC-LTL-Binary.7z" -OutFile "VC-LTL-Binary.7z"
          7z x VC-LTL-Binary.7z -oVC-LTL-Binary

      - name: Download and extract YY-Thunks
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.2.3/YY-Thunks-Objs.zip" -OutFile "YY-Thunks-Objs.zip"
          7z x YY-Thunks-Objs.zip -oYY-Thunks-Objs

      - name: Build binary
        run: |
          cargo build -Z build-std=std,panic_abort --release --target x86_64-win7-windows-msvc --no-default-features --features dist-windows-modern
          Copy-Item -Path "target\x86_64-win7-windows-msvc\release\TinyWiiBackupManager.exe" -Destination .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: clang-cl
          CXX: clang-cl
          AR: llvm-lib
          CFLAGS: /clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link
          CXXFLAGS: /clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\6.0.6000.0\lib\x64 -C link-arg=${{ github.workspace }}\YY-Thunks-Objs\objs\x64\YY_Thunks_for_Vista.obj -l dylib=ole32 -C link-arg=/FORCE:MULTIPLE -C link-arg=/SUBSYSTEM:WINDOWS,6.0
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_LINKER: lld-link

      - name: Rename binary
        run: |
          New-Item -Path "dist" -ItemType Directory -Force
          Copy-Item "TinyWiiBackupManager.exe" "dist\TinyWiiBackupManager-${{ env.VERSION_NAME }}-windows-x64.exe"

      - name: Upload Windows distributable
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-x64
          path: dist/*
